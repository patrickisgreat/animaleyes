services:
  animaleyes:
    build: .
    container_name: animaleyes
    restart: unless-stopped
    env_file: .env
    # Host networking so the app can find the camera by MAC in the host's ARP table (its IP
    # comes from DHCP). The dashboard binds 127.0.0.1:8081 only; Cloudflare Tunnel and
    # Tailscale Serve on the host are the only ways in. 8080 is robot-computer's dashboard.
    network_mode: host
    volumes:
      - ./config:/app/config          # config.toml, editable from the dashboard
      - ./data:/app/data              # reference photos in, SQLite + frames + captures out
      - petlibro-token:/root/.petlibro-cli   # petlibro-cli login cache survives rebuilds
    environment:
      - TZ=${TZ:-America/Chicago}
      - HOST=127.0.0.1
      - PORT=8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  petlibro-token:
