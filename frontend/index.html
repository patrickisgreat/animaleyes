<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>animaleyes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. For a custom theme we also
      // cache its CSS variables (themeVars) and apply them inline so there's no flash of a
      // built-in theme before React fetches the roster.
      (function () {
        try {
          document.documentElement.dataset.theme = localStorage.getItem("theme") || "sage";
          var vars = JSON.parse(localStorage.getItem("themeVars") || "null");
          if (vars) for (var k in vars) document.documentElement.style.setProperty(k, vars[k]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
